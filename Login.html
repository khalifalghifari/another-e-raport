<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Admin - E-Report</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="new.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar topbar sticky-top px-4" data-bs-theme="dark">
        <a class="navbar-brand text-white fw-bold" href="index.html">
            <i class="bi bi-journal-check brand-light me-1"></i> E-Report <span class="brand-light">Santri</span>
        </a>
        <a class="link-light link-opacity-75 link-opacity-100-hover text-decoration-none" href="index.html">Kembali ke beranda</a>
    </nav>

    <main class="auth-wrap">
        <div class="auth-card">
            <div class="icon-circle"><i class="bi bi-shield-lock"></i></div>
            <h1 class="h3">Masuk sebagai admin</h1>
            <p class="text-muted-green">Halaman ini hanya untuk pengelola E-Report.</p>

            <div id="err" class="alert alert-danger py-2" role="alert" hidden>Username atau password salah.</div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="user" class="form-label">Username</label>
                    <input id="user" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="pass" class="form-label">Password</label>
                    <input id="pass" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button class="btn btn-forest w-100 py-2" type="submit">Masuk</button>
            </form>
        </div>
    </main>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        const $ = id => document.getElementById(id);

        // sudah login? langsung kembali ke beranda
        if (isAdmin()) location.replace('index.html');

        $('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            if (login($('user').value.trim(), $('pass').value)) {
                location.href = 'index.html';
            } else {
                $('err').hidden = false;
                $('pass').value = '';
                $('pass').focus();
            }
        });
    </script>
</body>
</html>
