<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span> 
        </span>
        <div class="admin-profile">
            <div>
                <span>Admin</span>
                <small>Pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="index.html" class="menu-link"> <i class="bi bi-gear"></i> Menu Utama</a>
            <a href="dashboard.html" class="menu-link"> <i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statistik.html" class="menu-link active"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="setting.html" class="menu-link"> <i class="bi bi-gear"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Data Laporan statistik</h2>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <h5>Statistik laporan</h5>
                            <p>Jumlah laporan santri setiap bulan</p>
                            <div class="area-grafik">
                                <canvas id="santriChart" ></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <h5>Status Laporan</h5>
                            <p>Laporan santri</p>
                            <div class="area-grafik">
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
           
        </main>
    </div>
    
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
     <script>
        const ctx = document.getElementById('santriChart')

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ["Januari","februari","Maret","April","Mei"],
                datasets: [{
                    label : "jumlah laporan per-bulan",
                    data: [10,14,7,9,2],
                    backgroundColor: [
                        "royalblue",
                        "red",
                        "yellow",
                        "green",
                        'indigo'
                    ],
                    borderWidth: 3
                }]
            },
            options:{
                plugins: {
                    legend:{
                        position: "bottom"
                    }
                }
            }
        })
        const ctx2 = document.getElementById('statusChart')

        new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: ["Approved","Pending","Reject"],
                datasets: [{
                    label : "Status",
                    data: [10,14,7,],
                    backgroundColor: [
                       
                        "red",
                        "yellow",
                        "green",
                    
                    ],
                    borderWidth: 3
                }]
            },
            options:{
                plugins: {
                    legend:{
                        position: "bottom"
                    }
                }
            }
        })

        const grafikStatus = document.getElementById('grafikStatus');

new Chart(grafikStatus, {
    type: 'doughnut',

    data: {
        labels: ['Diterima', 'Menunggu', 'Ditolak'],

        datasets: [{
            label: 'Jumlah Laporan',
            data: [65, 25, 10],

            backgroundColor: [
                'mediumseagreen',
                'orange',
                'tomato'
            ],

            borderColor: 'white',
            borderWidth: 4,
            hoverOffset: 8
        }]
    },

    options: {
        responsive: true,
        maintainAspectRatio: false,

        plugins: {
            legend: {
                position: 'bottom'
            }
        }
    }
});
    </script>
</body>
</html>
